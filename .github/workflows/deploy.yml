name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Rebuild every 6 hours so /city-signals/ gets a fresh SF 311 snapshot
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx @11ty/eleventy
      # SF 311 snapshot + operations brief for /city-signals/. Non-fatal: if DataSF is down the
      # site still deploys and the page falls back to querying the API live.
      - name: City Signals snapshot
        run: node scripts/city-signals-snapshot.mjs _site/city-signals/data
        continue-on-error: true
        timeout-minutes: 25
        env:
          # Optional. Without it the brief publishes observations only.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url }}
    steps:
      # actions/deploy-pages flakes intermittently (the build always
      # succeeds). Swallow a transient first-attempt failure, wait, retry —
      # so a single flake self-heals to green instead of a red failed run.
      - id: deploy1
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before retry
        if: steps.deploy1.outcome == 'failure'
        run: sleep 20
      - id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4
